<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160e0e">
<title>트란실바니아 비망록</title>

<style>
:root {
  color-scheme: dark;
  --gold: #e1c58d;
  --paper: #ead9b4;
}

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

body {
  margin: 0;
  min-height: 100svh;
  background: radial-gradient(ellipse at center, #392725, #100b0a 78%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  font-family: Georgia, 'Noto Serif KR', serif;
  color: var(--paper);
}

.stage {
  width: min(100%, 520px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.book-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 2 / 3;
  overflow: hidden;
  box-shadow: 0 22px 55px #000b;
  border-radius: 3px;
  background: #321a17;
}

.book-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
}

/* 책의 걸쇠 클릭 영역 */
.lock-hotspot {
  position: absolute;
  left: 69%;
  top: 36.5%;
  width: 27%;
  height: 15%;
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
  border-radius: 18%;
  -webkit-tap-highlight-color: transparent;
}

.lock-hotspot:focus-visible {
  outline: 2px solid #f4d99b;
  outline-offset: 2px;
  background: #fff1;
}

.hint {
  font-size: 16px;
  letter-spacing: .08em;
  color: #e6d3ac;
  text-align: center;
  text-shadow: 0 2px 5px #000;
  opacity: .95;
  line-height: 1.6;
}

.reset {
  background: #1a100e;
  border: 1px solid #8a7048;
  color: #ddc99f;
  padding: 9px 18px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}

/* 양피지 팝업: 배경 책이 보이도록 어두운 막을 약하게 */
.modal {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(8, 5, 4, .42);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: clamp(12px, 3vh, 28px) 12px 18px;
  overflow-y: auto;
}

.modal-content {
  width: min(100%, 600px);
  min-height: calc(100svh - 30px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(10px, 2vh, 18px);
  margin: auto 0;
}

.parchment {
  display: block;
  width: min(100%, 560px);
  max-height: 55svh;
  object-fit: contain;
  filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .24));
  flex: 0 1 auto;
}

/* 입력칸과 봉인 해제 버튼 */
.answer-panel {
  width: min(86%, 360px);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
}

.answer {
  width: 100%;
  height: 48px;
  background: rgba(20, 13, 10, .78);
  border: 1px solid rgba(194, 162, 108, .9);
  padding: 10px 12px;
  color: #f5e5c4;
  font: 16px Georgia, 'Noto Serif KR', serif;
  text-align: center;
  border-radius: 2px;
  outline: none;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .2);
}

.answer:focus {
  border-color: #f0d9a7;
  box-shadow: 0 0 0 1px rgba(240, 217, 167, .22);
}

.actions {
  display: flex;
  justify-content: center;
}

.actions button {
  width: 100%;
  padding: 12px 14px;
  font: inherit;
  font-size: 14px;
  letter-spacing: .04em;
  cursor: pointer;
}

.submit {
  border: 1px solid #c5a66b;
  background: rgba(113, 78, 39, .94);
  color: #fff0d0;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .22);
}

.submit:active {
  background: #8d6a37;
  transform: translateY(1px);
}

.error {
  min-height: 22px;
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
  color: #f0b3a8;
  text-shadow: 0 2px 5px #000;
}

/* 화면 높이가 낮은 기기 대응 */
@media (max-height: 650px) {
  .modal {
    padding-top: 8px;
    padding-bottom: 8px;
  }

  .modal-content {
    min-height: calc(100svh - 16px);
    gap: 6px;
  }

  .parchment {
    max-height: 46svh;
    width: min(100%, 500px);
  }

  .answer-panel {
    gap: 6px;
  }

  .answer {
    height: 42px;
  }

  .actions button {
    padding: 9px;
  }

  .error {
    min-height: 18px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<main class="stage">

  <div class="book-frame" id="bookFrame" aria-label="트란실바니아 비망록">
    <img
      class="book-image"
      id="bookImage"
      src="cover.jpg"
      alt="낡은 버건디색 책 표지, 트란실바니아 비망록"
    >

    <button
      class="lock-hotspot"
      id="lockButton"
      type="button"
      aria-label="책의 걸쇠를 누르기"
      title="걸쇠"
    ></button>
  </div>

  <div class="hint" id="hint">
    걸쇠를 눌러 비망록을 여시오
  </div>

  <button class="reset" id="resetButton" hidden>
    처음 화면으로
  </button>

</main>


<!-- 양피지와 정답 입력 팝업 -->
<div class="modal" id="quizModal" hidden>

  <div
    class="modal-content"
    role="dialog"
    aria-modal="true"
    aria-label="양피지 기록"
  >

    <img
      class="parchment"
      src="parchment_clue.png"
      alt="트란실바니아의 기록과 단서가 적힌 양피지"
    >

    <form class="answer-panel" id="quizForm">

      <input
        class="answer"
        id="answer"
        name="answer"
        autocomplete="off"
        autocapitalize="off"
        aria-label="정답 입력"
        required
      >

      <div class="actions">
        <button class="submit" type="submit">
          봉인 해제 시도
        </button>
      </div>

      <div class="error" id="error" aria-live="polite"></div>

    </form>

  </div>
</div>


<script>
const KEY = 'transylvaniaMemoirUnlocked_v1';

const image = document.getElementById('bookImage');
const lockButton = document.getElementById('lockButton');
const modal = document.getElementById('quizModal');
const answer = document.getElementById('answer');
const error = document.getElementById('error');
const hint = document.getElementById('hint');
const resetButton = document.getElementById('resetButton');


/* 정답을 맞혔을 때 */
function showUnlocked() {
  image.src = 'open.jpg';
  image.alt = '펼쳐진 트란실바니아 비망록 안쪽, 보관 공간에 놓인 붉은 십자가';

  lockButton.hidden = true;
  modal.hidden = true;

  hint.textContent = '봉인이 풀렸다. 십자가가 모습을 드러냈다.';
  resetButton.hidden = false;
}


/* 처음 상태로 돌아가기 */
function showLocked() {
  image.src = 'cover.jpg';
  image.alt = '낡은 버건디색 책 표지, 트란실바니아 비망록';

  lockButton.hidden = false;
  modal.hidden = true;

  hint.textContent = '걸쇠를 눌러 비망록을 여시오';
  resetButton.hidden = true;

  localStorage.removeItem(KEY);
}


/* 이전에 정답을 맞혔다면 열린 책으로 표시 */
if (localStorage.getItem(KEY) === 'yes') {
  showUnlocked();
}


/* 걸쇠를 누르면 양피지 팝업 표시 */
lockButton.addEventListener('click', () => {
  modal.hidden = false;
  error.textContent = '';
  answer.value = '';

  setTimeout(() => answer.focus(), 50);
});


/* 팝업 바깥을 누르면 닫기 */
modal.addEventListener('click', (e) => {
  if (e.target === modal) {
    modal.hidden = true;
  }
});


/* 정답 확인 */
document.getElementById('quizForm').addEventListener('submit', (e) => {
  e.preventDefault();

  const userAnswer = answer.value.trim().replace(/\s/g, '');

  if (userAnswer === '반헬싱') {
    localStorage.setItem(KEY, 'yes');
    showUnlocked();
  } else {
    error.textContent = '걸쇠가 열리지 않는다. 다른 답일까?';
    answer.select();
  }
});


/* 처음 화면으로 돌아가기 */
resetButton.addEventListener('click', showLocked);


/* Escape 키로 팝업 닫기 */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !modal.hidden) {
    modal.hidden = true;
  }
});
</script>

</body>
</html>
